<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#081426">
    <title>Offline | Anush Portfolio</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
    <link rel="stylesheet" href="/css/style.css">
    <style>
      .offline-message { min-height: 100vh; display: grid; place-content: center; padding: 24px; text-align: center; }
      .offline-message p { color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="offline-message">
      <p class="eyebrow">Connection unavailable</p>
      <h1>You’re offline</h1>
      <p>This page isn’t available offline. Reconnect to continue browsing the portfolio.</p>
      <a class="button button-primary" href="/">Return to portfolio</a>
    </main>
  </body>
</html>
