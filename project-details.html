<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#081426">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/icon-512.png">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
    <meta name="description" content="Project idea details and planned areas for a portfolio project.">
    <title>Project Details | Personal Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
    <script src="js/project-details.js" defer></script>
  </head>
  <body class="project-details-page">
    <a class="skip-link" href="#project-details-main">Skip to project details</a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html#home" aria-label="Portfolio home">Portfolio<span>.</span></a>
      </div>
    </header>

    <main class="project-details-main" id="project-details-main">
      <div class="container">
        <a class="project-back-link" href="index.html#projects">
          <span aria-hidden="true">←</span> Back to Projects
        </a>
        <article class="project-details-card" id="project-details-card" aria-live="polite">
          <div class="project-details-art" id="project-details-art"></div>
          <div class="project-details-content">
            <p class="project-status" id="project-details-status"></p>
            <h1 id="project-details-title">Loading project…</h1>
            <p class="project-details-overview" id="project-details-overview"></p>
            <section aria-labelledby="project-areas-title">
              <h2 id="project-areas-title">Main areas</h2>
              <ul class="project-area-list" id="project-details-areas"></ul>
            </section>
            <p class="project-details-note" id="project-details-note" hidden></p>
          </div>
        </article>
        <p class="project-details-error" id="project-details-error" role="status" hidden>
          Project details could not be found. Return to the Projects section to choose a project.
        </p>
      </div>
    </main>

    <template id="smart-campus-illustration">
      <svg class="project-details-illustration" viewBox="0 0 100 100" role="img" aria-label="College campus building with a location pin">
        <defs><linearGradient id="campus-building" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75e1e5"/><stop offset="1" stop-color="#5797ed"/></linearGradient></defs>
        <path d="M12 43 43 27l31 16v39H12z" fill="url(#campus-building)" fill-opacity=".2" stroke="#83e4e6" stroke-width="2" stroke-linejoin="round"/>
        <path d="M8 44 43 25l35 19M23 51h8v9h-8zm19 0h8v9h-8zm19 0h8v9h-8zM38 66h11v16H38z" fill="none" stroke="#b3d8ff" stroke-width="2" stroke-linejoin="round"/>
        <path d="M75 15a12 12 0 0 0-12 12c0 9 12 22 12 22s12-13 12-22a12 12 0 0 0-12-12Z" fill="#2879ca" stroke="#9cecf0" stroke-width="2"/>
        <circle cx="75" cy="27" r="4" fill="#c8fbff"/>
      </svg>
    </template>
    <template id="aegisrecover-illustration">
      <svg class="project-details-illustration" viewBox="0 0 100 100" role="img" aria-label="Storage drive protected by a shield and recovery arrow">
        <defs><linearGradient id="drive-fill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#72dce5"/><stop offset="1" stop-color="#568ef0"/></linearGradient></defs>
        <rect x="12" y="42" width="72" height="40" rx="8" fill="url(#drive-fill)" fill-opacity=".22" stroke="#8ebcff" stroke-width="2"/>
        <path d="M20 53h56M20 72h42" stroke="#9fdcf3" stroke-width="2" stroke-linecap="round"/>
        <circle cx="72" cy="72" r="3" fill="#79e4df"/>
        <path d="M68 14h22v18c0 12-11 20-11 20S68 44 68 32z" fill="#164b83" stroke="#8be5e8" stroke-width="2" stroke-linejoin="round"/>
        <path d="M74 32a6 6 0 0 1 11-3m0-5v5h-5" fill="none" stroke="#c5f6fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </template>
    <template id="milk-tracker-illustration">
      <svg class="project-details-illustration" viewBox="0 0 100 100" role="img" aria-label="Milk bottle with a milk droplet">
        <defs><linearGradient id="milk-bottle" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d5faff"/><stop offset="1" stop-color="#70b8f5"/></linearGradient></defs>
        <path d="M34 20h24v10l7 8v43a6 6 0 0 1-6 6H33a6 6 0 0 1-6-6V38l7-8z" fill="url(#milk-bottle)" fill-opacity=".22" stroke="#a9d8ff" stroke-width="2" stroke-linejoin="round"/>
        <path d="M34 30h24M29 48h32" stroke="#c2f4f4" stroke-width="2" stroke-linecap="round"/>
        <path d="M76 45c-5 8-9 12-9 17a9 9 0 0 0 18 0c0-5-4-9-9-17Z" fill="#5ed5df" fill-opacity=".8" stroke="#b5f7f5" stroke-width="2"/>
        <path d="M73 63a4 4 0 0 0 4 4" fill="none" stroke="#e0ffff" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </template>
    <template id="scam-detector-illustration">
      <svg class="project-details-illustration" viewBox="0 0 100 100" role="img" aria-label="Smartphone showing a message with a security shield">
        <defs><linearGradient id="phone-fill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#79e0e5"/><stop offset="1" stop-color="#588fed"/></linearGradient></defs>
        <rect x="16" y="12" width="48" height="78" rx="9" fill="url(#phone-fill)" fill-opacity=".18" stroke="#9bc5ff" stroke-width="2"/>
        <path d="M31 20h18M35 81h10" stroke="#b8edfa" stroke-width="2" stroke-linecap="round"/>
        <path d="M24 35h29v19H40l-8 7v-7h-8z" fill="#1e5d91" stroke="#88e3e7" stroke-width="2" stroke-linejoin="round"/>
        <path d="M31 42h15M31 48h10" stroke="#c7f7f6" stroke-width="2" stroke-linecap="round"/>
        <path d="M69 47h22v18c0 12-11 19-11 19S69 77 69 65z" fill="#164b83" stroke="#8be5e8" stroke-width="2" stroke-linejoin="round"/>
        <path d="m75 64 4 4 7-8" fill="none" stroke="#d1ffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </template>
  </body>
</html>
